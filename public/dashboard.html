<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard RCA</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Interogari RCA</h1>
        <p>Upload Excel, procesare secventiala, export rezultate</p>
      </div>
      <form method="post" action="/logout"><button class="secondary">Logout</button></form>
    </header>

    <main class="layout">
      <section class="panel">
        <h2>Fisier scenarii</h2>
        <form id="upload-form">
          <input id="file" name="file" type="file" accept=".xlsx,.csv" required />
          <button type="submit">Porneste job</button>
        </form>
        <div class="actions">
          <a class="button secondary" href="/api/template">Descarca template</a>
          <button id="debug-button" class="secondary" type="button">Ruleaza debug</button>
          <button id="prompt-button" class="secondary" type="button">Prompt corectare excel</button>
        </div>
      </section>

      <section class="panel">
        <h2>Status</h2>
        <div id="status" class="status idle">Niciun job pornit</div>
        <progress id="progress" max="1" value="0"></progress>
        <p id="message"></p>
        <div id="timer-box" class="timer-box hidden">
          <div class="timer-display">
            <span class="timer-icon">⏱️</span>
            <span id="timer-text">Timp scurs: 00:00:00</span>
          </div>
          <div id="timer-stats" class="timer-stats"></div>
        </div>
        <div class="actions">
          <button id="resume" class="secondary hidden" type="button">Reluare dupa verificare</button>
          <button id="stop" class="button stop-btn" type="button">Opreste Job</button>
          <a id="download" class="button hidden" href="#">Descarca rezultat</a>
        </div>
      </section>

      <section class="panel wide">
        <h2>Ultimele randuri</h2>
        <table>
          <thead>
            <tr>
              <th>Rand</th>
              <th>Status</th>
              <th>Oferte</th>
              <th>Minim</th>
              <th>Eroare</th>
            </tr>
          </thead>
          <tbody id="results"></tbody>
        </table>
      </section>
    </main>

    <!-- Modal for Prompt -->
    <div id="prompt-modal" class="modal hidden">
      <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h2>Prompt Corectare Excel</h2>
        <textarea id="prompt-text" readonly rows="20" style="width: 100%; margin-bottom: 1rem;">Ești un agent expert în procesarea și validarea datelor pentru emiterea polițelor RCA pe platforma asigurari.ro din România. Sarcina ta este să primești date brute dintr-un tabel (Excel/CSV) și să le convertești STRICT în formatul și schema de coloane cerută de sistemul nostru, aplicând reguli riguroase de business pentru a preveni orice eroare (hard-error) la completarea automată a formularului web.

Iată schema de coloane exactă pe care trebuie să o aibă fișierul generat:
[nr_inmatriculare, vin, stare_legala, transfer_proprietate, tip_auto, combustibil, marca, model, serie_civ, an_fabricatie, masa_maxima_kg, cilindree_cm3, putere_kw, nr_locuri, judet, localitate, adresa, serie_ci, numar_ci, data_permis, conducator_principal_acelasi, data_start_polita, durata_luni, cod_postal, tip_utilizare, tip_persoana, nume, prenume, cnp, telefon, email]

CRITIC: Trebuie să aplici următoarele REGULI DE CORECȚIE ȘI VALIDARE pe datele primite, altfel formularul web va bloca cererea:

1. TRIANGULAREA OBLIGATORIE: JUDEȚ vs. NUMĂR ÎNMATRICULARE vs. LOCALITATE:
   - Formularul asigurari.ro are validare STRICTĂ: dacă județul declarat nu bate cu numărul de înmatriculare, cotația este blocată!
   - Extrage prefixul din `nr_inmatriculare`:
     * Dacă începe cu "B" urmat de cifră (ex: "B70HUS", "B100ABC") -> `judet` = "B". Localitatea TREBUIE să fie un sector: "Bucuresti Sectorul 1" (sau 2..6).
     * Dacă începe cu 2 litere (ex: "BH37BXA", "HD08HND", "CJ16BDU", "CL46DEX") -> `judet` = codul județului ("BH", "HD", "CJ", "CL").
   - Suprascrie OBLIGATORIU coloana `judet` cu acest cod extras din plăcuță.
   - Corelează `localitate`: dacă plăcuța este din județul "BH" (Bihor), localitatea nu poate fi din București, ci trebuie să fie un oraș/comună din Bihor (ex: "Oradea"). Dacă plăcuța e din "HD", localitatea este din Hunedoara (ex: "Deva").

2. CURĂȚAREA ȘI STANDARDIZAREA MODELULUI AUTO (model) - NICIODATĂ CÂMP GOL:
   - Câmpul `model` este OBLIGATORIU. Dacă în tabelul brut modelul lipsește sau este neclar, DEDUCE-L din Marcă, VIN, Cilindree și Putere.
   - Site-ul folosește denumiri comerciale standardizate:
     * MERCEDES-BENZ: Se grupează pe clase! Convertește "A", "A160", "A180" -> "Clasa A"; "C", "C180", "C220" -> "Clasa C"; "E", "E270", "E220" -> "Clasa E"; "S" -> "Clasa S"; "B" -> "Clasa B"; "M" / "ML" -> "Clasa M"; "GLK", "GLA", "GLC", "GLE", "Sprinter", "Vito".
     * BMW: Convertește în serii: "Seria 1", "Seria 3", "Seria 5", "Seria 7", "X1", "X3", "X5", "X6". Convertește coduri de șasiu gen "Nx51" -> "Seria 3" sau "Seria 5".
     * DACIA: Convertește obligatoriu codurile tehnice CIV de caroserie ("Lsdaa", "Lsdab", "L") -> "Logan". Convertește "Tle" -> "1310". Alte modele valide: "Sandero", "Duster", "Dokker", "Lodgy", "Spring".
     * AUDI: Convertește "Avant" -> "A4" sau "A6" (în funcție de motorizare).
     * ALFA ROMEO: Convertește "Sportwagon" -> "156" sau "159".
     * PEUGEOT: Convertește nivele de echipare gen "X-Line" sau coduri gen "Fap" -> "206" sau "307".
     * OPEL: Nu folosi tipuri de combustibil/motor ("Dti", "Tdi") ca model. Convertește-le în "Astra", "Corsa" sau "Vectra".
     * VOLKSWAGEN: Convertește coduri CIV ("Scaxpx01") -> "Golf" sau "Passat".
     * FIAT: Modele comerciale standard: "Punto", "Bravo", "Brava", "Doblo", "Stilo", "Panda", "500", "Tipo", "Ducato". Nu lăsa coduri gen "Axc1A".
   - Elimină balastul comercial (ex: "Trend", "Titanium", "Elegance", "1.6 TDI", "4x4", "Break") lăsând DOAR numele de bază al modelului.

3. STANDARDIZARE COMBUSTIBIL (combustibil):
   - Formularul web acceptă STRICT valorile: "Benzina", "Motorina", "Hybrid Benzina", "Hybrid Motorina", "Electric", "Benzina si GPL".
   - NICIODATĂ nu pune valoarea generică "Hibrid". Dacă vehiculul este hibrid, pune "Hybrid Benzina" (standard pentru marea majoritate a hibridelor, ex: Toyota Yaris, Prius, Auris) sau "Hybrid Motorina".

4. SERIA C.I.V. (Cartea de Identitate a Vehiculului):
   - Dacă există o serie CIV reală în datele brute, folosește-o (format standard: 1 literă urmată de 6 cifre, ex: A123456).
   - Dacă seria CIV lipsește, este neclară sau invalidă, folosește OBLIGATORIU seria oficială de control a sistemului asigurari.ro: L123456. (Nu folosi J125354 sau alte șiruri arbitrare).

5. REGULA CELOR 60 DE ZILE (data_start_polita):
   - Polița RCA nu poate începe la o distanță mai mare de 60 de zile față de data curentă de azi.
   - Format: DD.MM.YYYY. Dacă data este depășită sau mai mare de 60 de zile în viitor, ajusteaz-o automat să fie la exact 30 de zile distanță de azi.

6. CORECTAREA CODULUI POȘTAL (cod_postal):
   - Trebuie să aibă OBLIGATORIU exact 6 cifre.
   - Dacă are 5 cifre (din cauza tăierii zeroului în Excel), adaugă "0" în față (ex: 40982 -> 040982).

7. CURĂȚAREA DE FORMULE ȘI DATE CORUPTE:
   - Orice valoare eronată (#REF!, #N/A, #VALUE!, [object Object]) trebuie eliminată.
   - Elimină complet funcțiile de calcul (ex: =RANDBETWEEN).

8. NUMĂR TELEFON (telefon):
   - Fix 10 cifre, începând cu "0" (ex: 0720000000).

9. STANDARDIZARE C.N.P.:
   - Fix 13 cifre numerice. Format standard text (fără notație exponențială gen 1.81E+12).

10. STANDARDIZARE LOCALITATE BUCUREȘTI (localitate):
   - Dacă județul este "B", localitatea trebuie să fie STRICT unul dintre cele 6 sectoare: "Bucuresti Sectorul 1", "Bucuresti Sectorul 2", "Bucuresti Sectorul 3", "Bucuresti Sectorul 4", "Bucuresti Sectorul 5", "Bucuresti Sectorul 6".

FORMAT DE IEȘIRE:
Folosind capabilitățile tale de analiză de date, generează și oferă pentru descărcare un fișier de tip EXCEL (.xlsx) care să conțină exclusiv datele curățate și validate, având exact header-ul menționat mai sus. Nu returna JSON.
</textarea>
        <button id="copy-prompt-btn" class="button">Copiază Prompt</button>
      </div>
    </div>

    <script src="/assets/app.js?v=8"></script>
  </body>
</html>
